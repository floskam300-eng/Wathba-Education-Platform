# postgres.conf — WATHBA Database performance parameters for 16GB RAM KVM4 VPS
# (Assuming ~4GB is allocated to Postgres)

shared_buffers = 1GB              # 25% of allocated RAM
effective_cache_size = 3GB        # 75% of allocated RAM
work_mem = 16MB                   # memory per sort/hash
maintenance_work_mem = 256MB
max_connections = 60              # pool capacity margin (pool max is 20)
random_page_cost = 1.1            # optimized for NVMe SSD storage
effective_io_concurrency = 200
checkpoint_completion_target = 0.9
wal_buffers = 16MB
max_worker_processes = 4          # match 4 vCPU
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
