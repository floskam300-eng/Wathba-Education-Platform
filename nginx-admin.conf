server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # React Router — fallback all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Allow image uploads up to 15 MB (default nginx limit is 1 MB)
    client_max_body_size 15m;

    # Docker internal DNS resolver — re-resolves container IPs every 10s
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Proxy API calls to the backend app container
    location /api/ {
        set $upstream_app app;
        proxy_pass                  http://$upstream_app:3001;
        proxy_http_version          1.1;
        proxy_set_header            Host              $host;
        proxy_set_header            X-Real-IP         $remote_addr;
        proxy_set_header            X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header            X-Forwarded-Proto $scheme;
        proxy_read_timeout          120s;
        # Do not buffer the request body before passing to backend —
        # important for file uploads so nginx doesn't hold the connection open
        proxy_request_buffering     off;
        proxy_connect_timeout       10s;
        proxy_send_timeout          60s;
    }

    # Proxy uploads (images, PDFs) to the backend app container
    location /uploads/ {
        set $upstream_app app;
        proxy_pass         http://$upstream_app:3001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
    }

    # Security headers
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff|ttf)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
